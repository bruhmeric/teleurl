# Render.com Blueprint — deploy with: Render Dashboard -> New -> Blueprint
# (select the repo containing this file), then fill in the secret values
# when prompted.  See README.md "Deploy on Render.com" for the full walkthrough.
#
# FREE TIER NOTES (default below):
#   * The instance sleeps after ~15 min without INBOUND http traffic -> the
#     bot pauses polling.  Keep it awake with a free uptime pinger
#     (UptimeRobot / cron-job.org) hitting https://<service>.onrender.com/
#     every 10 minutes, or upgrade the plan.
#   * The filesystem is EPHEMERAL: vault.db is wiped on every deploy/restart.
#     For a real vault, switch plan to "starter" and uncomment the disk block
#     plus the DB_PATH env var below (disks need a paid instance).
services:
  - type: web
    name: zk-image-vault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # ---- secrets: fill these in the Render dashboard (sync: false) ----
      - key: BOT_TOKEN
        sync: false
      - key: MASTER_PASSPHRASE
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      # ---- behaviour ----
      - key: ALLOW_CHANNEL_MEMBERS
        value: "1"
      - key: SPOILER_ON_GET
        value: "1"
      - key: WATERMARK_ZK
        value: "1"
      - key: VIEW_TTL_SECONDS
        value: "60"
      - key: LINK_TTL_SECONDS
        value: "600"
      # BASE_URL is auto-detected from RENDER_EXTERNAL_URL (https is built in),
      # so /secret zero-knowledge links work out of the box.
      # ---- persistent vault (PAID: switch plan to "starter" and uncomment) ----
      # disk:
      #   name: vault-data
      #   mountPath: /var/data
      #   sizeGB: 1
      # and add this env var:
      # - key: DB_PATH
      #   value: /var/data/vault.db
