# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — minimal & maximally compatible
# Docs: https://render.com/docs/blueprint-spec
#
# This is intentionally minimal. After the service is created, add your
# secret env vars (BOT_TOKEN, API_ID, API_HASH, OWNER_ID, DATABASE_URL,
# LOG_CHANNEL) in Render's Environment tab.
#
# WEBAPP_URL is auto-detected from Render's RENDER_EXTERNAL_URL — no action
# needed. PORT is auto-injected by Render. RENDER=true is auto-injected.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: telegram-url-uploader
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      # Optional tunables — feel free to delete or change
      - key: ALLOW_BOT_URL_UPLOAD
        value: "true"
      - key: FFMPEG_PATH
        value: "/usr/bin/ffmpeg"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: KEEP_ALIVE_INTERVAL
        value: "600"
      - key: ENABLE_PLAYWRIGHT
        value: "false"
      - key: ENABLE_PO_TOKEN_SERVER
        value: "false"
      - key: ENABLE_ARIA2
        value: "false"
      # Secrets — Render will prompt you to fill these in the dashboard
      # after sync. Leave value empty.
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LOG_CHANNEL
        sync: false
